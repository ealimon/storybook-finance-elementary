<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <!-- Background Golden Yellow Gradient matching reference -->
    <linearGradient id="goldBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fcc419"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Subtle radial highlight for Apple App Store depth -->
    <radialGradient id="topGlow" cx="50%" cy="20%" r="65%" fx="50%" fy="15%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Owl Brown Feather Gradient -->
    <linearGradient id="owlBrown" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8d4925"/>
      <stop offset="40%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#552207"/>
    </linearGradient>

    <!-- Forehead / Brow Plum Feather Band -->
    <linearGradient id="browBand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#642b3b"/>
      <stop offset="100%" stop-color="#4c1d29"/>
    </linearGradient>

    <!-- Soft Creamy Peach Belly -->
    <linearGradient id="peachBelly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="25%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fecdd3"/>
    </linearGradient>

    <!-- Eye Golden Iris Gradient -->
    <linearGradient id="irisGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>

    <!-- Beak & Feet Orange Gradient -->
    <linearGradient id="beakOrange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#78350f" flood-opacity="0.32"/>
    </filter>
    <filter id="innerGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Apple App Store Solid Background (Full-bleed 1024x1024 square with NO rounded corners and NO transparency) -->
  <rect width="1024" height="1024" fill="url(#goldBg)"/>
  <rect width="1024" height="1024" fill="url(#topGlow)"/>

  <!-- Ground Ambient Shadow under Owl Mascot -->
  <ellipse cx="512" cy="840" rx="260" ry="42" fill="#78350f" fill-opacity="0.25"/>

  <!-- Main Owl Mascot Group -->
  <g filter="url(#softShadow)">

    <!-- Feet (Layered behind body) -->
    <g fill="url(#beakOrange)" stroke="#9a3412" stroke-width="10" stroke-linejoin="round">
      <!-- Left Foot -->
      <g transform="translate(425, 785)">
        <path d="M-45 0 C-45 28 -30 42 0 42 C30 42 45 28 45 0 C45 -12 25 -18 0 -18 C-25 -18 -45 -12 -45 0 Z"/>
        <circle cx="-25" cy="22" r="14"/>
        <circle cx="0" cy="28" r="15"/>
        <circle cx="25" cy="22" r="14"/>
      </g>
      <!-- Right Foot -->
      <g transform="translate(599, 785)">
        <path d="M-45 0 C-45 28 -30 42 0 42 C30 42 45 28 45 0 C45 -12 25 -18 0 -18 C-25 -18 -45 -12 -45 0 Z"/>
        <circle cx="-25" cy="22" r="14"/>
        <circle cx="0" cy="28" r="15"/>
        <circle cx="25" cy="22" r="14"/>
      </g>
    </g>

    <!-- Owl Head & Body Silhouettes (Cocoa Brown) -->
    <!-- Ears / Crown Tufts -->
    <path d="M290 350 C290 280 320 220 370 230 C410 240 450 290 512 290 C574 290 614 240 654 230 C704 220 734 280 734 350 Z" 
          fill="url(#owlBrown)" stroke="#271105" stroke-width="18" stroke-linejoin="round"/>

    <!-- Main Plump Rounded Body -->
    <ellipse cx="512" cy="535" rx="225" ry="245" fill="url(#owlBrown)" stroke="#271105" stroke-width="18"/>

    <!-- Left Wing Curve -->
    <path d="M295 440 C280 540 310 650 360 700 C340 640 330 550 350 460 Z" 
          fill="#441a05" fill-opacity="0.3"/>
    <!-- Right Wing Curve -->
    <path d="M729 440 C744 540 714 650 664 700 C684 640 694 550 674 460 Z" 
          fill="#441a05" fill-opacity="0.3"/>

    <!-- Cute Soft Creamy Peach Belly -->
    <path d="M360 550 C360 460 428 420 512 420 C596 420 664 460 664 550 C664 670 600 735 512 735 C424 735 360 670 360 550 Z" 
          fill="url(#peachBelly)" stroke="#271105" stroke-width="14"/>

    <!-- Forehead Feather / Brow Plaque (Purplish Mauve accent from the reference image) -->
    <path d="M390 360 C420 330 460 320 512 320 C564 320 604 330 634 360 C584 395 540 405 512 405 C484 405 440 395 390 360 Z" 
          fill="url(#browBand)" stroke="#271105" stroke-width="12"/>

    <!-- Big Adorable Owl Eyes -->
    <!-- Left Eye Group -->
    <g>
      <!-- Outer Dark Eye Rim -->
      <circle cx="410" cy="385" r="96" fill="#200f05" stroke="#140a03" stroke-width="12"/>
      <!-- Golden Iris -->
      <circle cx="410" cy="385" r="76" fill="url(#irisGold)"/>
      <circle cx="410" cy="385" r="76" fill="none" stroke="#d97706" stroke-width="6"/>
      <!-- Black Pupil -->
      <circle cx="410" cy="385" r="44" fill="#111827"/>
      <!-- Catchlight Sparkle (top right) -->
      <circle cx="426" cy="365" r="16" fill="#ffffff"/>
      <circle cx="395" cy="405" r="7" fill="#ffffff" fill-opacity="0.75"/>
    </g>

    <!-- Right Eye Group -->
    <g>
      <!-- Outer Dark Eye Rim -->
      <circle cx="614" cy="385" r="96" fill="#200f05" stroke="#140a03" stroke-width="12"/>
      <!-- Golden Iris -->
      <circle cx="614" cy="385" r="76" fill="url(#irisGold)"/>
      <circle cx="614" cy="385" r="76" fill="none" stroke="#d97706" stroke-width="6"/>
      <!-- Black Pupil -->
      <circle cx="614" cy="385" r="44" fill="#111827"/>
      <!-- Catchlight Sparkle (top right) -->
      <circle cx="630" cy="365" r="16" fill="#ffffff"/>
      <circle cx="599" cy="405" r="7" fill="#ffffff" fill-opacity="0.75"/>
    </g>

    <!-- Cute Triangle Beak (Nestled between the eyes) -->
    <g>
      <path d="M472 405 Q512 390 552 405 L512 475 Z" 
            fill="url(#beakOrange)" stroke="#271105" stroke-width="14" stroke-linejoin="round"/>
      <!-- Beak highlight -->
      <path d="M492 414 Q512 406 532 414 L512 450 Z" 
            fill="#ffedd5" fill-opacity="0.45"/>
    </g>

  </g>
</svg>